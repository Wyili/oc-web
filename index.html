<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="oc-web：opencode 相关静态网页的统一入口（oc-lark 展示页 / opencode 使用手册）。">
  <meta name="theme-color" content="#080d18">
  <title>oc-web · 统一静态网页</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <style>
    :root{--bg:#080d18;--surface:#0d1525;--line:#263650;--ink:#f4f7ff;--muted:#aeb9cd;--subtle:#7f8da7;--cyan:#83dbe4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(880px,calc(100% - 40px));margin:0 auto}
    header .wrap{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}
    .brand{font-weight:700;letter-spacing:.5px}
    .brand i{color:var(--cyan);font-style:normal}
    .repo{color:var(--muted);font-size:13px}
    .repo:hover{color:var(--cyan)}
    main{flex:1;display:flex;align-items:center;padding:72px 0}
    h1{font-size:40px;line-height:1.25;letter-spacing:.5px}
    h1 em{color:var(--cyan);font-style:normal}
    .lead{color:var(--muted);margin-top:14px;max-width:600px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:block;transition:border-color .2s,transform .2s}
    .card:hover{border-color:var(--cyan);transform:translateY(-2px)}
    .tag{font-size:11px;letter-spacing:1.5px;color:var(--subtle)}
    .card h2{font-size:18px;margin:10px 0 8px}
    .card p{color:var(--muted);font-size:13.5px}
    .go{display:inline-block;margin-top:16px;color:var(--cyan);font-size:13px}
    footer{border-top:1px solid var(--line);padding:18px 0}
    footer .wrap{display:flex;justify-content:space-between;color:var(--subtle);font-size:13px}
    @media(max-width:720px){.cards{grid-template-columns:1fr}h1{font-size:32px}main{padding:48px 0}}
  </style>
</head>
<body>
  <header><div class="wrap"><span class="brand"><i>oc</i>-web</span><a class="repo" href="https://github.com/Wyili/oc-web">GitHub ↗</a></div></header>
  <main>
    <div class="wrap">
      <h1>opencode 相关网页<br><em>统一入口</em></h1>
      <p class="lead">静态页面，GitHub Pages 托管。现有站点如下；新增页面会在这里登记。</p>
      <div class="cards">
        <a class="card" href="oc-lark/">
          <span class="tag">OC-LARK</span>
          <h2>飞书 × OpenCode 连接服务</h2>
          <p>产品官网：特性、架构、CLI / 飞书命令、配置指南与本地控制台说明。</p>
          <span class="go">进入 →</span>
        </a>
        <a class="card" href="docs/">
          <span class="tag">DOCS</span>
          <h2>opencode 使用手册</h2>
          <p>运行时文档 25 页：快速上手 / 核心能力 / 应用实践 / 附录。</p>
          <span class="go">进入 →</span>
        </a>
      </div>
    </div>
  </main>
  <footer><div class="wrap"><span>oc-web · 静态页面</span><span>MIT License</span></div></footer>
</body>
</html>
